<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrossel V2 | Fluxxo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/carrosselv2.css">
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="avatar">IV</div>
    <div>
      <div class="uname">institutovertebra</div>
      <div class="usub">Patrocinado</div>
    </div>
    <div class="dots">&#8942;</div>
  </div>

  <div class="stage" id="stage">
    <div class="counter"><span id="counterText">1/6</span></div>
    <div class="track" id="track"></div>
    <button class="nav prev" id="prevBtn" aria-label="Anterior">&#10094;</button>
    <button class="nav next" id="nextBtn" aria-label="Próxima">&#10095;</button>
  </div>

  <div class="dashes" id="dashes"></div>

  <div class="actions">
    <span>&#9825;</span>
    <span>&#128172;</span>
    <span>&#10148;</span>
    <span class="right">&#128278;</span>
  </div>

  <div class="likes">Curtido por especialistas e outras pessoas</div>
  <div class="caption"><b>institutovertebra</b> Dia Nacional de Combate ao Fumo — veja como o cigarro prejudica a sua coluna.</div>
  <div class="time">Há 2 horas</div>
</div>

<script src="js/carrosselv2.js"></script>
</body>
</html>
