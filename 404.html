<style>

.card{text-align:center;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:18px}
.mk{width:52px;height:52px}
.code{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.2em;color:var(--purple-light)}

.btn{display:inline-flex;align-items:center;gap:10px;margin-top:8px;font-size:15px;font-weight:600;color:#fff;
  background:linear-gradient(120deg,#4a1647,#7c3aed);padding:15px 26px;border-radius:12px;text-decoration:none;
  box-shadow:0 0 0 1px rgba(181,123,255,.32) inset,0 10px 34px rgba(139,61,255,.35);transition:transform .15s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.links{display:flex;gap:18px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.links a{font-family:'Space Mono',monospace;font-size:12.5px;color:var(--muted);text-decoration:none;transition:color .2s}
.links a:hover{color:var(--purple-light)}
