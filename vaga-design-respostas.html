<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidatos · Vaga de Design | Fluxxo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0815">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=945">
<link rel="stylesheet" href="css/vaga.css?v=1">
</head>
<body>

<!-- ============ PAINEL ============ -->
<div class="rp-wrap" id="rpApp">
  <div class="rp-top">
    <div>
      <img src="img/brand/logo.webp" alt="fluxxo" class="brand-img">
      <h1>Candidatos · Designer de redes sociais</h1>
    </div>
    <div class="rp-actions">
      <button class="rp-btn" id="rpReload" type="button">Atualizar</button>
      <button class="rp-btn" id="rpCsv" type="button">Baixar planilha (CSV)</button>
      <a class="rp-btn" href="vaga-design.html" target="_blank" rel="noopener">Ver formulário</a>
    </div>
  </div>

  <div class="rp-stats">
    <div class="rp-stat"><small>Candidaturas</small><b id="sTotal">0</b></div>
    <div class="rp-stat"><small>Topam o teste</small><b id="sTeste">0</b></div>
    <div class="rp-stat"><small>Aceitam R$ 1.000</small><b id="sValor">0</b></div>
    <div class="rp-stat"><small>Aprovados</small><b id="sAprov">0</b></div>
  </div>

  <div class="rp-bar">
    <input type="search" id="fBusca" placeholder="Buscar por nome, cidade, e-mail, ferramenta…">
    <select id="fTeste"><option value="">Teste prático: todos</option><option value="Sim">Topa o teste</option><option value="Não">Não topa</option></select>
    <select id="fValor"><option value="">Valor: todos</option><option value="Sim">Aceita R$ 1.000</option><option value="Não">Não aceita</option></select>
    <select id="fStatus"><option value="">Status: todos</option></select>
  </div>

  <p class="vg-err" id="rpErr" hidden></p>
  <div class="rp-list" id="rpList"></div>
</div>

<script src="js/vaga-respostas.js?v=2"></script>
</body>
</html>
